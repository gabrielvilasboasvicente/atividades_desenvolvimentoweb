<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
        }

        form {
            background-color: white;
            max-width: 450px;
            margin: 0 auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
            color: #444;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        select,
        textarea,
        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #4a90e2;
            background-color: #f4f8fd;
            outline: none;
        }

        .opcao {
            font-weight: normal;
            display: inline-block;
            margin-right: 15px;
            margin-top: 5px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #357abd;
        }

        button[type="reset"] {
            background-color: #888;
            margin-top: 10px;
        }

        button[type="reset"]:hover {
            background-color: #666;
        }

        @media (max-width: 500px) {
            body {
                padding: 10px;
            }

            form {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <form>
        <h2>Cadastro</h2>

        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" required>

        <label for="nascimento">Data de nascimento:</label>
        <input type="date" id="nascimento" name="nascimento">

        <label for="curso">Curso:</label>
        <select id="curso" name="curso">
            <option value="">Selecione um curso</option>
            <option value="ads">Análise e Desenvolvimento de Sistemas</option>
            <option value="si">Engenharia de software</option>
            <option value="cc">Ciência da Computação</option>
        </select>

        <label>Sexo:</label>
        <label class="opcao"><input type="radio" name="sexo" value="feminino"> Feminino</label>
        <label class="opcao"><input type="radio" name="sexo" value="masculino"> Masculino</label>
        <label class="opcao"><input type="radio" name="sexo" value="outro"> Outro</label>

        <label>Interesses:</label>
        <label class="opcao"><input type="checkbox" name="interesses" value="html"> HTML</label>
        <label class="opcao"><input type="checkbox" name="interesses" value="css"> CSS</label>
        <label class="opcao"><input type="checkbox" name="interesses" value="js"> JavaScript</label>

        <label for="comentarios">Comentários:</label>
        <textarea id="comentarios" name="comentarios" rows="4"></textarea>

        <label for="foto">Upload de foto:</label>
        <input type="file" id="foto" name="foto" accept="image/*">

        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
    </form>

</body>
</html>
